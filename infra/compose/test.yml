version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_server_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_server_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: test-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4.3
    container_name: test-scylladb
    restart: unless-stopped
    command: --smp 1 --memory 512M --overprovisioned 1 --developer-mode 1 --api-address 0.0.0.0
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: test-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_test_data:/var/lib/kafka/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/migrate.Dockerfile
    container_name: test-migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chat_server_test
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_SSL_MODE=disable
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=chat_server_test
      - SCYLLA_CONSISTENCY=ONE
      - MIGRATION_ACTION=up
      - MIGRATE_DB=all
    depends_on:
      postgres:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    networks:
      - test-network
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: test-api
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chat_server_test
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - REDIS_DB=0
      - WEBSOCKET_REDIS_HOST=redis
      - WEBSOCKET_REDIS_PORT=6379
      - WEBSOCKET_REDIS_PASSWORD=redis123
      - WEBSOCKET_REDIS_DB=1
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=chat_server_test
      - SCYLLA_CONSISTENCY=ONE
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - GIN_MODE=debug
      - JWT_SECRET=test-jwt-secret-for-local-testing-only-32c
      - JWT_EXPIRY=24h
      - KAFKA_BROKERS=kafka:9092
      - CLOUDINARY_URL=${CLOUDINARY_URL:-cloudinary://test:test@test}
      - CORS_ALLOWED_ORIGINS=http://localhost:8888
      - SWAGGER_HOST=localhost:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylladb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - test-network

  chat:
    build:
      context: ../..
      dockerfile: infra/docker/chat.Dockerfile
    container_name: test-chat
    restart: unless-stopped
    environment:
      - WEBSOCKET_REDIS_HOST=redis
      - WEBSOCKET_REDIS_PORT=6379
      - WEBSOCKET_REDIS_PASSWORD=redis123
      - WEBSOCKET_REDIS_DB=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - REDIS_DB=0
      - JWT_SECRET=test-jwt-secret-for-local-testing-only-32c
      - JWT_EXPIRY=24h
      - KAFKA_BROKERS=kafka:9092
      - CLOUDINARY_URL=${CLOUDINARY_URL:-cloudinary://test:test@test}
      - CHAT_PORT=8081
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - test-network

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    container_name: test-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - test-network

  nginx:
    image: nginx:alpine
    container_name: test-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ../nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - chat
      - web
    networks:
      - test-network

volumes:
  postgres_test_data:
  kafka_test_data:

networks:
  test-network:
    driver: bridge
