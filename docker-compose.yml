version: '3.8'

services:
  api:
    image: ${DOCKERHUB_USERNAME}/chat-service-api:${API_VERSION:-latest}
    container_name: chat-server-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chat_server
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - REDIS_DB=0
      - WEBSOCKET_REDIS_HOST=redis
      - WEBSOCKET_REDIS_PORT=6379
      - WEBSOCKET_REDIS_PASSWORD=redis123
      - WEBSOCKET_REDIS_DB=1
      - SCYLLA_HOST=scylladb
      - SCYLLA_PORT=9042
      - SCYLLA_KEYSPACE=chat_server
      - SCYLLA_CONSISTENCY=QUORUM
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - GIN_MODE=release
      - JWT_SECRET=your-jwt-secret-change-in-production-min-32-chars
      - JWT_EXPIRY=24h
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - WS_READ_BUFFER_SIZE=1024
      - WS_WRITE_BUFFER_SIZE=1024
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=chat-server-consumers
      - KAFKA_TOPIC_MESSAGE_CREATED=chat.message.created
      - KAFKA_TOPIC_MESSAGE_DELETED=chat.message.deleted
      - KAFKA_TOPIC_CONVERSATION_UPDATED=chat.conversation.updated
      - SWAGGER_HOST=api:8080
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - chat-network

  chat:
    image: ${DOCKERHUB_USERNAME}/chat-service-chat:${CHAT_VERSION:-latest}
    container_name: chat-server-chat
    restart: unless-stopped
    environment:
      - WEBSOCKET_REDIS_HOST=redis
      - WEBSOCKET_REDIS_PORT=6379
      - WEBSOCKET_REDIS_PASSWORD=redis123
      - WEBSOCKET_REDIS_DB=1
      - JWT_SECRET=your-jwt-secret-change-in-production-min-32-chars
      - JWT_EXPIRY=24h
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=chat-service-consumers
      - KAFKA_TOPIC_MESSAGE_CREATED=chat.message.created
      - KAFKA_TOPIC_MESSAGE_DELETED=chat.message.deleted
      - KAFKA_TOPIC_CONVERSATION_UPDATED=chat.conversation.updated
    depends_on:
      - redis
      - kafka
    networks:
      - chat-network

  postgres:
    image: postgres:15-alpine
    container_name: chat-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-server-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4.3
    container_name: chat-server-scylladb
    restart: unless-stopped
    command: --smp 2 --memory 2G --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "9042:9042"
      - "9160:9160"
      - "10000:10000"
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chat-server-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: lz4
      CLUSTER_ID: chat-server-kafka-cluster
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  kafka_data:

networks:
  chat-network:
    driver: bridge

