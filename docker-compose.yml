version: '3.8'

services:
  migrate:
    image: ${DOCKERHUB_USERNAME}/chat-service-migrate:${MIGRATE_VERSION:-latest}
    container_name: chat-server-migrate
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-chat_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - SCYLLA_HOST=${SCYLLA_HOST:-scylladb}
      - SCYLLA_PORT=${SCYLLA_PORT:-9042}
      - SCYLLA_KEYSPACE=${SCYLLA_KEYSPACE:-chat_server}
      - SCYLLA_CONSISTENCY=${SCYLLA_CONSISTENCY:-QUORUM}
      - MIGRATION_ACTION=${MIGRATION_ACTION:-up}
      - MIGRATE_DB=${MIGRATE_DB:-all}
    depends_on:
      postgres:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    networks:
      - chat-network
    restart: "no"

  api:
    image: ${DOCKERHUB_USERNAME}/chat-service-api:${API_VERSION:-latest}
    container_name: chat-server-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-chat_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_DB=${REDIS_DB:-0}
      - WEBSOCKET_REDIS_HOST=${WEBSOCKET_REDIS_HOST:-redis}
      - WEBSOCKET_REDIS_PORT=${WEBSOCKET_REDIS_PORT:-6379}
      - WEBSOCKET_REDIS_PASSWORD=${WEBSOCKET_REDIS_PASSWORD:-redis123}
      - WEBSOCKET_REDIS_DB=${WEBSOCKET_REDIS_DB:-1}
      - SCYLLA_HOST=${SCYLLA_HOST:-scylladb}
      - SCYLLA_PORT=${SCYLLA_PORT:-9042}
      - SCYLLA_KEYSPACE=${SCYLLA_KEYSPACE:-chat_server}
      - SCYLLA_CONSISTENCY=${SCYLLA_CONSISTENCY:-QUORUM}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production-min-32-chars}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - WS_READ_BUFFER_SIZE=${WS_READ_BUFFER_SIZE:-1024}
      - WS_WRITE_BUFFER_SIZE=${WS_WRITE_BUFFER_SIZE:-1024}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - SWAGGER_HOST=${SWAGGER_HOST:-api:8080}
    depends_on:
      - postgres
      - redis
      - scylladb
      - kafka
      - migrate
    networks:
      - chat-network

  chat:
    image: ${DOCKERHUB_USERNAME}/chat-service-chat:${CHAT_VERSION:-latest}
    container_name: chat-server-chat
    restart: unless-stopped
    environment:
      - WEBSOCKET_REDIS_HOST=${WEBSOCKET_REDIS_HOST:-redis}
      - WEBSOCKET_REDIS_PORT=${WEBSOCKET_REDIS_PORT:-6379}
      - WEBSOCKET_REDIS_PASSWORD=${WEBSOCKET_REDIS_PASSWORD:-redis123}
      - WEBSOCKET_REDIS_DB=${WEBSOCKET_REDIS_DB:-1}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production-min-32-chars}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    depends_on:
      - redis
      - kafka
    networks:
      - chat-network

  web:
    image: ${DOCKERHUB_USERNAME}/chat-service-web:${WEB_VERSION:-latest}
    container_name: chat-server-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080}
      - VITE_APP_NAME=${VITE_APP_NAME:-Chat Server}
    depends_on:
      - api
    networks:
      - chat-network

  postgres:
    image: postgres:15-alpine
    container_name: chat-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chat_server}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-server-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4.3
    container_name: chat-server-scylladb
    restart: unless-stopped
    command: --smp 2 --memory 2G --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"
      - "${SCYLLA_THRIFT_PORT:-9160}:9160"
      - "${SCYLLA_API_PORT:-10000}:10000"
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chat-server-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  kafka_data:

networks:
  chat-network:
    driver: bridge
