name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (latest, v1.2.3, sha-abcd...)'
        required: false
        default: 'latest'
        type: string
      services:
        description: 'Services to update (comma-separated: api,chat,web,migrate or "all")'
        required: false
        default: 'all'
        type: string
      run_migrations:
        description: 'Run DB migrations before restarting services'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      SERVICES: ${{ inputs.services }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations == false && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SERVER_PASSWORD" > ~/.ssh/pw
          chmod 600 ~/.ssh/pw
          ssh-keyscan -H -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deploy script
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          sshpass -f ~/.ssh/pw scp -P "$SERVER_PORT" \
            scripts/deploy.sh \
            "$SERVER_USER@$SERVER_HOST:$SERVER_DEPLOY_PATH/deploy.sh"
          sshpass -f ~/.ssh/pw ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "chmod +x $SERVER_DEPLOY_PATH/deploy.sh"

      - name: Run deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          sshpass -f ~/.ssh/pw ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd $SERVER_DEPLOY_PATH && \
             VERSION='$VERSION' \
             SERVICES='$SERVICES' \
             RUN_MIGRATIONS='$RUN_MIGRATIONS' \
             HEALTH_URL='http://localhost:5241/api/health' \
             ./deploy.sh"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/pw
