name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release with artifacts'
        type: boolean
        default: false
      tag:
        description: 'Release tag (e.g. v1.0.0). Required when release=true'
        type: string
        required: false

env:
  FLUTTER_VERSION: '3.35.6'
  APP_DIR: clients/apps

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate code
        working-directory: ${{ env.APP_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test || true

  build-android:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate code
        working-directory: ${{ env.APP_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK split-per-abi (release, unsigned)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Build APK universal (release, unsigned)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Build AAB (release, unsigned)
        if: inputs.release == true
        working-directory: ${{ env.APP_DIR }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload AAB artifact
        if: inputs.release == true
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ env.APP_DIR }}/build/app/outputs/bundle/release/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Generate code
        working-directory: ${{ env.APP_DIR }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Package Runner.app
        working-directory: ${{ env.APP_DIR }}/build/ios/iphoneos
        run: zip -r ../../../../chat_app-ios.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ env.APP_DIR }}/chat_app-ios.zip
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: inputs.release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag input
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::release=true requires a tag input"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-aab/*.aab
            artifacts/ios-build/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
