name: Electron Desktop Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release with artifacts'
        type: boolean
        default: false
      tag:
        description: 'Release tag (e.g. v1.0.0). Required when release=true'
        type: string
        required: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.1.2'
  CLIENTS_DIR: clients

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Chat-mac
            patterns: |
              clients/desktop/release/*.dmg
              clients/desktop/release/*.zip
          - os: windows-latest
            artifact: Chat-win
            patterns: |
              clients/desktop/release/*.exe
          - os: ubuntu-latest
            artifact: Chat-linux
            patterns: |
              clients/desktop/release/*.AppImage
              clients/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.CLIENTS_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.CLIENTS_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Approve native build scripts
        working-directory: ${{ env.CLIENTS_DIR }}
        run: pnpm rebuild --filter desktop || true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ${{ env.CLIENTS_DIR }}/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm package:mac

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ${{ env.CLIENTS_DIR }}/desktop
        run: pnpm package:win

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ env.CLIENTS_DIR }}/desktop
        run: pnpm package:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.patterns }}
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    if: inputs.release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag input
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::release=true requires a tag input"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            artifacts/Chat-mac/*.dmg
            artifacts/Chat-mac/*.zip
            artifacts/Chat-win/*.exe
            artifacts/Chat-linux/*.AppImage
            artifacts/Chat-linux/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
