      tags:
      - messages
  /messages/{conversationId}:
    get:
      description: Get messages from a conversation with pagination
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - default: 50
        description: Limit number of messages
        in: query
        name: limit
        type: integer
      - description: Get messages before this message ID (timeuuid)
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_message.MessagesListSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
