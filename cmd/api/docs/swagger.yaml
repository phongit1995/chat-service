info:
  contact:
    email: support@chatserver.com
    name: API Support
  description: A chat server API with authentication and real-time messaging
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Chat Server API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's password
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.ChangePasswordSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get access token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.AuthSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Blacklist the caller's JWT so it cannot be used again before its
        natural expiry
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Logout (invalidate token)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access token (rotates
        the refresh token)
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat-server_internal_utils.BaseResponse-internal_modules_auth_RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_auth.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Register a new user
      tags:
      - auth
  /calls/{id}/answer:
    post:
      parameters:
      - description: Call ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_call.CallTokenSuccessResponse'
      security:
      - BearerAuth: []
      summary: Answer a call
      tags:
      - calls
  /calls/{id}/decline:
    post:
      parameters:
      - description: Call ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_call.SimpleSuccessResponse'
      security:
      - BearerAuth: []
      summary: Decline a call
      tags:
      - calls
  /calls/{id}/end:
    post:
      parameters:
      - description: Call ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_call.SimpleSuccessResponse'
      security:
      - BearerAuth: []
      summary: End a call
      tags:
      - calls
  /calls/start:
    post:
      consumes:
      - application/json
      description: Create a LiveKit room and notify other participants
      parameters:
      - description: Start call
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_call.StartCallRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_call.CallTokenSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Start a call
      tags:
      - calls
  /conversations:
    get:
      description: Get all conversations for the authenticated user
      parameters:
      - default: 50
        description: Limit number of conversations
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationsListSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get user conversations
      tags:
      - conversations
  /conversations/{id}:
    get:
      description: Get full detail of a conversation including other-user info and
        presence (direct only)
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
