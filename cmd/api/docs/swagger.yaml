info:
  contact:
    email: support@chatserver.com
    name: API Support
  description: A chat server API with authentication and real-time messaging
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Chat Server API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get access token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth.AuthSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_auth.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Register a new user
      tags:
      - auth
  /conversations:
    get:
      description: Get all conversations for the authenticated user
      parameters:
      - default: 50
        description: Limit number of conversations
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationsListSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get user conversations
      tags:
      - conversations
  /conversations/{id}/hide:
    post:
      description: Hide a conversation from the user's inbox. It will reappear when
        a new message arrives.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.HideConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Hide conversation
      tags:
      - conversations
  /conversations/{id}/read:
    put:
      description: Mark all messages in a conversation as read for the authenticated
        user
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.SimpleSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Mark conversation as read
      tags:
      - conversations
  /conversations/{id}/unhide:
    post:
      description: Manually unhide a previously hidden conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.UnhideConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Unhide conversation
      tags:
      - conversations
  /conversations/direct:
    post:
      consumes:
      - application/json
      description: Create or get existing direct conversation between two users
      parameters:
      - description: Create Direct Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_conversation.CreateDirectConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create direct conversation
      tags:
      - conversations
  /conversations/direct/check:
    get:
      description: Check if direct conversation exists without creating it
      parameters:
      - description: Recipient User ID
        in: query
        name: recipientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Check direct conversation
      tags:
      - conversations
  /conversations/group:
    post:
      consumes:
      - application/json
      description: Create a new group conversation with multiple participants
      parameters:
      - description: Create Group Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_conversation.CreateGroupConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create group conversation
      tags:
      - conversations
  /conversations/typing:
    post:
      consumes:
      - application/json
      description: Send typing indicator to conversation members (rate limited to
        5s)
      parameters:
