        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "413":
