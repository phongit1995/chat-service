      - BearerAuth: []
      summary: Get messages
      tags:
      - messages
  /messages/{conversationId}/{messageId}:
    delete:
      description: Delete a message (soft delete)
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Message ID (timeuuid)
        in: path
        name: messageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_message.SimpleSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Delete message
      tags:
      - messages
    patch:
      consumes:
      - application/json
      description: Update message content (edit message)
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Message ID (timeuuid)
        in: path
        name: messageId
        required: true
        type: string
      - description: Update Message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_message.UpdateMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_message.MessageSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Update message
      tags:
      - messages
  /messages/{conversationId}/{messageId}/reactions:
    post:
      consumes:
      - application/json
      description: Toggle a reaction (LIKE/LOVE/HAHA/WOW/SAD/ANGRY) on a message.
