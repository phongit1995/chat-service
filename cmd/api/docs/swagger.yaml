            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get conversation detail
      tags:
      - conversations
  /conversations/{id}/hide:
    post:
      description: Hide a conversation from the user's inbox. It will reappear when
        a new message arrives.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.HideConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Hide conversation
      tags:
      - conversations
  /conversations/{id}/mute:
    post:
      description: Mute notifications for a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.SimpleSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Mute conversation
      tags:
      - conversations
  /conversations/{id}/read:
    put:
      description: Mark all messages in a conversation as read for the authenticated
        user
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.SimpleSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Mark conversation as read
      tags:
      - conversations
  /conversations/{id}/unhide:
    post:
      description: Manually unhide a previously hidden conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.UnhideConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Unhide conversation
      tags:
      - conversations
  /conversations/{id}/unmute:
    post:
      description: Re-enable notifications for a conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.SimpleSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Unmute conversation
      tags:
      - conversations
  /conversations/direct:
    post:
      consumes:
      - application/json
      description: Create or get existing direct conversation between two users
      parameters:
      - description: Create Direct Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_conversation.CreateDirectConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create direct conversation
      tags:
      - conversations
  /conversations/direct/check:
    get:
      description: Check if direct conversation exists without creating it
      parameters:
      - description: Recipient User ID
        in: query
        name: recipientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Check direct conversation
      tags:
      - conversations
  /conversations/group:
    post:
      consumes:
      - application/json
      description: Create a new group conversation with multiple participants
      parameters:
      - description: Create Group Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_conversation.CreateGroupConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_conversation.ConversationSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create group conversation
      tags:
      - conversations
  /conversations/typing:
    post:
      consumes:
      - application/json
      description: Send typing indicator to conversation members (rate limited to
        5s)
      parameters:
      - description: Typing Indicator
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_conversation.TypingIndicatorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_conversation.TypingIndicatorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Send typing indicator
      tags:
      - conversations
  /health:
    get:
      description: Check the health status of the API and database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_health.HealthSuccessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
      summary: Health check
      tags:
