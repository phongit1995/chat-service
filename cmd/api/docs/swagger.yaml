      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Message ID (timeuuid)
        in: path
        name: messageId
        required: true
        type: string
      - description: Reaction type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_message.ToggleReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_message.MessageSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/chat-server_internal_utils.APIError'
