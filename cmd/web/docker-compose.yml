version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-Chat Server}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - chat-network

networks:
  chat-network:
    external: true
